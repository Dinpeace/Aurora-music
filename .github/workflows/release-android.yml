name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is required"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is required"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is required"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/aurora-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=aurora-release-key.jks
          EOF

      - name: Build signed APK
        run: flutter build apk --release

      - name: Generate SHA-256 checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > SHA256SUMS.txt

      - name: Rename release APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AuroraMusic-${GITHUB_REF_NAME}.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraMusic-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/AuroraMusic-${{ github.ref_name }}.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/AuroraMusic-${{ github.ref_name }}.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
