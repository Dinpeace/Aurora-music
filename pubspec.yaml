name: aurora_music
description: Aurora Music - Modern music player.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Audio
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # Permissions
  permission_handler: ^12.0.3

  # YouTube / Online Music
  youtube_explode_dart: ^3.1.0
  youtube_player_iframe: ^6.0.2

  # Networking
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0

  # Storage
  shared_preferences: ^2.5.5

  # Firebase / Authentication
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0

  # UI
  google_fonts: ^8.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true